<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerName wp-starter.local
        DocumentRoot /var/www/html

        SSLEngine on
        SSLCertificateFile /etc/apache2/ssl/wp-starter.local.pem
        SSLCertificateKeyFile /etc/apache2/ssl/wp-starter.local-key.pem

        <Directory /var/www/html>
            AllowOverride All
            Require all granted
        </Directory>
    </VirtualHost>
</IfModule>